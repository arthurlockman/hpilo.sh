# Unified certificate automation for BMCs behind Tailscale.
#
#   tailscale     : one sidecar with a real TUN device; every cert service
#                   shares its network namespace, so BMC FQDNs resolve via
#                   Tailscale DNS and all BMC traffic obeys your tailnet ACLs.
#   hpilo         : HPE iLO issuance + resident renewal cron (acme.sh).
#   supermicro-a/b: Supermicro issuance via lego + cert upload over the BMC
#                   web UI; runs a check every RUN_INTERVAL seconds and only
#                   renews when the installed cert is LE and expiring <30d.
#
# Notes:
#   * The BMC cert names need DNS overrides in the Tailscale admin console
#     (or approved subnet routes) so the shared netns can resolve them.
#   * Supermicro uploads reboot the BMC to apply the certificate; HPE iLO
#     imports without a reboot.
#   * On the Mac (Apple container runtime) use docker-compose.apple.yml,
#     which runs tailscaled inside the hpilo container instead.

x-dns-creds: &dns-creds
  # One Cloudflare token with Zone:DNS:Edit serves both acme.sh (dns_cf) and
  # lego (cloudflare provider).
  CF_Token: "your-cloudflare-api-token"
  CLOUDFLARE_DNS_API_TOKEN: "your-cloudflare-api-token"

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: certs-tailscale
    hostname: certbot
    restart: unless-stopped
    environment:
      # Reusable auth key, tagged (e.g. tag:hpilo-certs); ACLs grant that tag
      # access to the BMC nodes. Only needed on first join; state persists.
      # userspace networking would leave the shared netns without tailnet
      # routing; TUN mode (NET_ADMIN + /dev/net/tun below) is required.
      TS_USERSPACE: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: certbot
      # accept-routes: reach subnet-routed BMCs
      TS_EXTRA_ARGS: "--accept-routes"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tailscale:/var/lib/tailscale
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  hpilo:
    image: ghcr.io/arthurlockman/hpilo.sh:master
    container_name: hpilo-le
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      <<: *dns-creds
      # iLO credentials and certificate name
      ILO_USERNAME: "Administrator"
      ILO_PASSWORD: "changeme"
      ILO_HOSTNAME: "grand-central"
      # what the iLO itself reports (DHCP-supplied) vs the cert name
      ILO_DOMAIN: "mgmt.rosafamily.us"
      ILO_CERT_DOMAIN: "ipmi.rosafamily.us"
      ILO_STAGING: "1" # flip to 0 after the first successful deployment
      ILO_DNSAPI: "dns_cf"
      ILO_ACME_CA: "letsencrypt"
    volumes:
      - ./acme:/acme.sh
      - ./data:/data

  supermicro-a:
    image: ghcr.io/marthydavid/supermicro-letsencrypt:latest
    container_name: supermicro-a-le
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      <<: *dns-creds
      IPMI_USERNAME: "ADMIN"
      IPMI_PASSWORD: "changeme"
      IPMI_DOMAIN: "sup-a.ipmi.rosafamily.us"
      LE_EMAIL: "you@example.com"
      DNS_PROVIDER: "cloudflare"
      # Board generation: X9, X10, X11, X12 (X13 uses X12). Check the BMC.
      MODEL: "X11"
    # Upstream image is a one-shot (built for cronjobs); loop it instead.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - 'while true; do /home/lego/le-supermicro-ipmi.sh; echo "next check in ${RUN_INTERVAL:-21600}s"; sleep "${RUN_INTERVAL:-21600}"; done'
    volumes:
      - ./lego-a:/home/lego/.lego

  supermicro-b:
    image: ghcr.io/marthydavid/supermicro-letsencrypt:latest
    container_name: supermicro-b-le
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      <<: *dns-creds
      IPMI_USERNAME: "ADMIN"
      IPMI_PASSWORD: "changeme"
      IPMI_DOMAIN: "sup-b.ipmi.rosafamily.us"
      LE_EMAIL: "you@example.com"
      DNS_PROVIDER: "cloudflare"
      MODEL: "X11"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - 'while true; do /home/lego/le-supermicro-ipmi.sh; echo "next check in ${RUN_INTERVAL:-21600}s"; sleep "${RUN_INTERVAL:-21600}"; done'
    volumes:
      - ./lego-b:/home/lego/.lego
